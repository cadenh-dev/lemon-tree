name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: bun run lint
          - name: Bun type check
            command: bun run typecheck
          - name: TypeScript compiler
            command: bun run typecheck:tsc
          - name: Storage tests
            command: bun run test
          - name: Application build
            command: bun run build
          - name: Electron UI tests
            command: bun run test:ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

  portable:
    name: ${{ matrix.os }} portable checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Lint and type check
        run: bun run check
      - name: TypeScript compiler
        run: bun run typecheck:tsc
      - name: Storage tests
        run: bun run test
      - name: Application build
        run: bun run build
      - name: Windows UI smoke test
        if: runner.os == 'Windows'
        working-directory: tests
        run: bunx playwright test platform.spec.ts --config ../playwright.config.ts
      - name: React Doctor
        run: bun run react-doctor

  package:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: bun run package:win
          - os: ubuntu-latest
            command: bun run package:linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Package
        run: ${{ matrix.command }}

  react-doctor:
    name: React Doctor
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: React Doctor
        run: bun run react-doctor
